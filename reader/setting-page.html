<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="母艦檔案">
  <meta name="theme-color" content="#050000">
  <title>末日母艦 - 機密設定集</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="apple-touch-icon" href="../assets/icon-192.png">
  <link rel="stylesheet" href="setting-page.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="dossier-container">
    <header class="dossier-header">
      <div class="header-main">
        <h1>[ 核心機密檔案系統 ]</h1>
        <div id="sync-status" class="status">> 正在初始化母巢連線...</div>
      </div>
      <div id="save-load-controls" class="save-load-bar">
        <button id="export-btn" class="abyss-btn">導出記憶片段</button>
        <button id="import-btn" class="abyss-btn">載入記憶片段</button>
      </div>
      <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
        </svg>
        返回閱讀器
      </a>
    </header>
    
    <div class="filter-bar">
      <span class="filter-label">濾波篩選:</span>
      <button class="filter-btn active" data-category="all">全部</button>
      <button class="filter-btn" data-category="核心名詞">核心</button>
      <button class="filter-btn" data-category="世界">世界</button>
      <button class="filter-btn" data-category="角色">角色</button>
      <button class="filter-btn" data-category="力量">力量</button>
      <button class="filter-btn" data-category="卷">卷</button>
      <button class="filter-btn" data-category="勢力">勢力</button>
      <button class="filter-btn" data-category="地點">地點</button>
      <button class="filter-btn" data-category="事件">事件</button>
      <button class="filter-btn" data-category="資源">資源</button>
    </div>

    <main id="dossier-grid" class="dossier-grid">
      <div class="loading-state">正在同步資料庫信號...</div>
    </main>

    <footer class="dossier-footer">
      <p>© ARK-SYSTEM AUDIT DIVISION. UNAUTHORIZED ACCESS IS A TERMINAL OFFENSE.</p>
    </footer>
  </div>
  <!-- Legacy entry point retained for rollback: setting-page.js -->
  <script type="module" src="dossier.js"></script>
</body>
</html>
