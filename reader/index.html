<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="無漏閱讀器">
  <meta name="theme-color" content="#0d1117">
  <title>《無漏》專案閱讀器</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">

  <!-- Set the boot theme before any paint to prevent a theme flash on load -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('reader-theme');
        if (['light', 'sepia', 'dark', 'oled'].indexOf(t) === -1) {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <style>
    :root { --boot-bg: #faf7f0; }
    :root[data-theme="sepia"] { --boot-bg: #f4ecd8; }
    :root[data-theme="dark"]  { --boot-bg: #0d1117; }
    :root[data-theme="oled"]  { --boot-bg: #000000; }
    html { background: var(--boot-bg); }
  </style>

  <!-- Self-hosted subset fonts (no external CDN, works offline) -->
  <link rel="preload" href="fonts/NotoSerifTC-subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">

  <!-- Markdown parser (vendored; provides window.marked used by the reader) -->
  <script defer src="vendor/marked.min.js"></script>

  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="reader.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="annotations.css">
</head>
<body>
  <div class="app sidebar-collapsed">
    <div id="reading-progress" class="reading-progress"></div>

    <!-- Sidebar Directory -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2>《無漏》目錄</h2>
        <button id="sidebar-close-btn" class="icon-btn" aria-label="關閉目錄">✕</button>
      </div>
      <div class="search-wrap">
        <input id="search-input" type="text" placeholder="搜尋章節或內文..." aria-label="搜尋章節">
      </div>
      <div id="status" class="status">正在加載目錄...</div>
      <nav id="chapter-list" class="chapter-list"></nav>
    </aside>
    <div class="sidebar-overlay"></div>

    <!-- Main Content Viewer -->
    <main class="main-wrapper">
      <header class="top-nav">
        <div class="nav-left">
          <button id="menu-btn" class="icon-btn" aria-label="開啟目錄">☰</button>
          <h1 id="chapter-title" class="chapter-title">《無漏》閱讀器</h1>
        </div>
        <div class="nav-controls">
          <button id="bookmark-btn" class="icon-btn" title="書籤">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="none" stroke="currentColor" stroke-width="2" d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            </svg>
          </button>
          <button id="annot-toggle" class="icon-btn" title="劃線與批註">✍</button>
          <button id="tts-toggle" class="icon-btn" title="語音朗讀">🔊</button>
          <button id="theme-toggle" class="icon-btn" title="切換主題">🌙</button>
          <button id="settings-btn" class="icon-btn" title="閱讀設定" aria-label="閱讀設定">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="4" y1="8" x2="20" y2="8"/><circle cx="9" cy="8" r="2.4" fill="var(--surface)"/>
              <line x1="4" y1="16" x2="20" y2="16"/><circle cx="15" cy="16" r="2.4" fill="var(--surface)"/>
            </svg>
          </button>
          <button id="font-size-dec" class="icon-btn" title="縮小字體">A-</button>
          <button id="font-size-inc" class="icon-btn" title="放大字體">A+</button>
        </div>
      </header>

      <article id="content" class="content"></article>

      <footer class="bottom-nav">
        <button id="prev-btn" class="nav-btn" disabled>上一章</button>
        <span id="word-count">字數: 0</span>
        <button id="next-btn" class="nav-btn" disabled>下一章</button>
      </footer>
    </main>
  </div>

  <!-- Bottom Panel for Control/Settings/TTS -->
  <div class="bottom-panel-overlay"></div>
  <div id="bottom-panel" class="bottom-panel">
    <div class="bottom-panel-handle"></div>
    <div class="panel-section">
      <h3>語音朗讀</h3>
      <div class="panel-row">
        <button id="tts-panel-toggle" class="panel-btn">播放 / 暫停</button>
        <button id="tts-stop-btn" class="panel-btn danger">停止</button>
      </div>
      <div class="panel-row">
        <label>語速: <span id="tts-rate-label">1.0</span>x</label>
        <input id="tts-rate" type="range" min="0.5" max="2.0" step="0.1" value="1.0">
      </div>
      <div class="panel-row">
        <select id="tts-start-select">
          <option value="current">從當前章節開始</option>
          <option value="beginning">從第一章開始</option>
        </select>
      </div>
    </div>
    <div class="panel-section">
      <h3>閱讀設定</h3>

      <div class="panel-field">
        <label class="panel-field-label">主題</label>
        <div class="theme-swatches" role="group" aria-label="閱讀主題">
          <button class="theme-swatch" data-theme="light" title="日間" aria-label="日間主題"><span class="swatch-chip"></span>日</button>
          <button class="theme-swatch" data-theme="sepia" title="米紙" aria-label="米紙主題"><span class="swatch-chip"></span>紙</button>
          <button class="theme-swatch" data-theme="dark" title="夜間" aria-label="夜間主題"><span class="swatch-chip"></span>夜</button>
          <button class="theme-swatch" data-theme="oled" title="純黑" aria-label="純黑主題"><span class="swatch-chip"></span>黑</button>
        </div>
      </div>

      <div class="panel-field panel-field-inline">
        <label class="panel-field-label">字級</label>
        <div class="font-size-control">
          <button id="panel-font-dec" class="panel-btn small">A-</button>
          <span id="panel-font-label">1.1</span>
          <button id="panel-font-inc" class="panel-btn small">A+</button>
        </div>
      </div>

      <div class="panel-field panel-field-inline">
        <label class="panel-field-label">字體</label>
        <div class="seg-toggle" id="font-family-toggle" role="group" aria-label="字體">
          <button class="seg-btn" data-font="serif">襯線</button>
          <button class="seg-btn" data-font="sans">黑體</button>
        </div>
      </div>

      <div class="panel-field">
        <label class="panel-field-label">行寬 <span id="measure-label" class="panel-value"></span></label>
        <input id="measure-range" type="range" min="34" max="60" step="1" aria-label="行寬">
      </div>

      <div class="panel-field">
        <label class="panel-field-label">行距 <span id="lineheight-label" class="panel-value"></span></label>
        <input id="lineheight-range" type="range" min="1.5" max="2.4" step="0.05" aria-label="行距">
      </div>
    </div>
  </div>

  <!-- Annotations Panel Drawer -->
  <div class="annot-panel-overlay"></div>
  <div id="annot-panel" class="annot-panel">
    <div class="annot-panel-header">
      <h3>劃線與批註</h3>
      <button class="annot-panel-close icon-btn">✕</button>
    </div>
    <div class="annot-panel-body"></div>
  </div>

  <button id="highlight-fab" class="highlight-fab" title="標記選取文字">✎</button>

  <!-- Resume Toast -->
  <div id="resume-toast" class="resume-toast" hidden>
    <span class="resume-text">續讀提醒</span>
    <button class="resume-jump">前往</button>
    <button class="resume-dismiss">忽略</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
